<form class="search" method="get" role="search"><label class="sr-only" for="search-input">{{ placeholder }}</label><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search-input" type="search" name="q" value="{{ q }}" placeholder="{{ placeholder }}" maxlength="200">{% if status %}<label class="sr-only" for="status-filter">Situação das tarefas</label><select id="status-filter" name="status"><option value="all" {% if status == 'all' %}selected{% endif %}>Todas</option><option value="open" {% if status == 'open' %}selected{% endif %}>Pendentes</option><option value="overdue" {% if status == 'overdue' %}selected{% endif %}>Atrasadas</option><option value="completed" {% if status == 'completed' %}selected{% endif %}>Concluídas</option></select>{% endif %}<button type="submit" class="button secondary">Buscar</button>{% if q %}<a href="{{ request.path }}">Limpar</a>{% endif %}</form>
